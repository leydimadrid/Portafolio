<label class="label" (click)="startDownload()">
  <input
    type="checkbox"
    class="input"
    [(ngModel)]="isChecked"
    aria-label="Descargar CV"
  />
  <span class="circle"
    ><i class="bx bxs-download" style="font-size: 20px" aria-hidden="true"></i>
    <div class="square"></div>
  </span>
  <p class="title">Descargar CV</p>
</label>
